[project]
name = "cordis-field-classifier"
version = "0.1.0"
description = "Multi-label classification of EU research projects into scientific fields, with leakage-safe splits, calibrated thresholds and a temporal-shift test."
readme = "README.md"
license = "MIT"
authors = [{ name = "Paulo Villalobos", email = "265691890+paulovillalobos@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "typer>=0.12",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "tabulate>=0.9",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "torch>=2.4"]
finetune = ["transformers>=4.44", "torch>=2.4", "accelerate>=0.33"]
report = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "mypy>=1.11", "pandas-stubs"]

[project.scripts]
fieldclf = "fieldclf.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fieldclf"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "sentence_transformers", "transformers", "torch", "torch.*"]
ignore_missing_imports = true
