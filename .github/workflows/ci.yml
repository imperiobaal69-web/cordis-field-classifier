name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen --group dev
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q

  finetune:
    # The fine-tuning path needs PyTorch, which the core install leaves out.
    # CPU wheels keep the job small; the tests use a tiny random BERT.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen --group dev
      - name: Install CPU PyTorch and Transformers
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install "transformers>=4.44" "accelerate>=0.33"
      - name: Fine-tuning tests
        run: uv run --no-sync pytest -q tests/test_finetune.py

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen --group dev
      - name: Train smoke model on synthetic data
        run: uv run python scripts/smoke_model.py artifacts
      - name: Build image
        run: docker build --build-arg MODEL_DIR=artifacts/tfidf_logreg -t fieldclf:ci .
      - name: Smoke-test container
        run: |
          docker run -d --name api -p 8000:8000 fieldclf:ci
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"texts":["quantum photon laser optics plasma research"]}' | tee /dev/stderr \
            | grep -q '"fields"'
